<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5f0">
  <meta name="app-build" content="vrmine-game-hub-2026-08-15-1">
  <meta name="description" content="触れてほどけるVRChat公開ワールドと配布可能な3D素材を確認できるVRMineポータル。">
  <title>VRMine</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header">
    <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">◇</span><span>VRMine</span></a>
    <nav class="header-actions" aria-label="主要ナビゲーション">
      <a class="btn btn-small" href="#games"><span>ワールド・体験</span></a>
      <a class="btn btn-small" href="./io/"><span>3D素材</span></a>
    </nav>
  </header>

  <main class="shell" id="main">
    <section class="hero">
      <p class="eyebrow">Quest-First Tactile Playbox</p>
      <h1>触れてほどける、<br>応答する空間体験。</h1>
      <p class="lead">PCとQuest双方のVRChat実クライアントで体験できる空間と、制作に使える3D素材をまとめています。</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="./games/perspective-cage/">視点の檻を見る</a>
        <a class="btn" href="./io/">3D素材を探す</a>
      </div>
    </section>

    <section class="section" id="games">
      <div class="section-head">
        <div><p class="eyebrow">Worlds</p><h2>公開ワールド・体験 <span class="badge"><span data-game-count>1</span> title</span></h2></div>
        <p>VRChat向けの空間体験を確認できます。</p>
      </div>
      <div class="game-grid" data-game-grid></div>
    </section>

    <section class="section asset-market" id="assets">
      <div class="section-head asset-market-head">
        <div><p class="eyebrow">3D assets</p><h2>作品から選ぶ3D素材</h2></div>
        <p>照明、家具、食器、小物。画像から選び、商品ごとの寸法・配布形式・利用条件を確認できます。</p>
      </div>
      <p><a class="btn btn-primary" href="./io/">3D素材をすべて見る →</a></p>
      <div class="asset-market-grid">
        <!-- product-previews:start -->
        <!-- product-previews:end -->
      </div>
    </section>

  </main>

  <footer class="site-footer">VRMine</footer>
  <script type="module" src="./assets/app.js"></script>
</body>
</html>

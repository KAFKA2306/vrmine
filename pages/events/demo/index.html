<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VRMine branded event game demo">
  <title>VRMine Event Demo</title>
  <link rel="stylesheet" href="../../assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header">
    <a class="brand" href="../../"><span class="brand-mark" aria-hidden="true">◇</span><span>VRMine Event Hub</span></a>
  </header>
  <main class="shell" id="main" data-event-root>
    <section class="hero">
      <p class="eyebrow">Event game hub</p>
      <h1 data-event-name>イベントを読み込んでいます…</h1>
      <p class="lead" data-organizer></p>
      <div class="hero-actions">
        <a class="btn btn-primary" data-start-game href="../../games/answer-impostor/?event=demo&pack=demo">Answer Impostorを始める</a>
        <a class="btn" data-event-cta href="../../organizers/">主催者向けPoCを見る</a>
      </div>
    </section>
    <section class="section">
      <div class="section-head"><div><p class="eyebrow">Privacy</p><h2>計測するのは4つの集計イベントだけ</h2></div></div>
      <p><code>view_hub</code> / <code>start_game</code> / <code>complete_game</code> / <code>cta_click</code> の回数だけを扱います。氏名、回答内容、端末識別子は送信しません。集計endpointが設定されていないdemoでは、この端末のlocalStorageにのみ記録します。</p>
      <p><button class="btn btn-small" type="button" data-export-events>この端末の集計をJSONで保存</button></p>
    </section>
  </main>
  <footer class="site-footer">VRMine event PoC</footer>
  <script type="module" src="../event.js"></script>
</body>
</html>

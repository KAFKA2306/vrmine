<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VRMine World Item Gallery</title>
  <style>
    :root{color-scheme:dark;background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif}body{margin:0}.wrap{max-width:1080px;margin:auto;padding:48px 24px}a{color:inherit}.eyebrow{color:#8b949e;text-transform:uppercase;letter-spacing:.12em;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:28px}.card{border:1px solid #30363d;border-radius:16px;overflow:hidden;background:#161b22;text-decoration:none}.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#20262e}.meta{padding:18px}.meta h2{margin:0 0 8px;font-size:20px}.meta p{margin:0;color:#8b949e}.price{margin-top:12px;color:#e6edf3;font-weight:700}</style>
</head>
<body><main class="wrap">
  <div class="eyebrow">VRMine / 3D World Item Factory</div>
  <h1>World Item Gallery</h1>
  <p>実際に生成・検証されたワールド向け3D商品を、spec・形式・multi-angle renderと一緒に公開します。</p>
  <section class="grid">
    <a class="card" href="items/open-frame-shelf-01/">
      <img src="items/open-frame-shelf-01/view-hero.png" alt="Open Frame Shelf hero render">
      <div class="meta"><h2>Open Frame Shelf</h2><p>Tables / Stools / Shelves · 0.75 × 0.32 × 1.20 m</p><div class="price">Price hypothesis ¥300</div></div>
    </a>
  </section>
</main></body></html>

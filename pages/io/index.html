<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VRMine World Item Gallery</title>
<style>:root{color-scheme:dark;background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:48px 24px}a{color:inherit}.eyebrow{color:#8b949e;text-transform:uppercase;letter-spacing:.12em;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:28px}.card{border:1px solid #30363d;border-radius:16px;overflow:hidden;background:#161b22;text-decoration:none}.card img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block;background:#20262e}.meta{padding:16px}.meta h2{margin:0 0 7px;font-size:18px}.meta p{margin:0;color:#8b949e;font-size:13px}.error{padding:16px;border:1px solid #f85149;border-radius:12px;color:#ffb3ad}</style></head>
<body><main class="wrap"><div class="eyebrow">VRMine / 3D World Item Factory</div><h1>World Item Gallery</h1><p>公開済みの3D製品を、実レンダリングから選んで多面Viewで確認できます。</p><section class="grid" id="grid"></section></main>
<script>
const grid=document.getElementById('grid');
const title=id=>id.replace(/-01$/,'').split('-').map(x=>x[0].toUpperCase()+x.slice(1)).join(' ');
const catalogUrl='https://api.github.com/repos/KAFKA2306/vrmine/contents/pages/io/items?ref=main';
fetch(catalogUrl,{headers:{Accept:'application/vnd.github+json'}})
  .then(response=>{if(!response.ok)throw new Error(`GitHub catalog request failed: HTTP ${response.status}`);return response.json();})
  .then(entries=>{
    if(!Array.isArray(entries))throw new Error('GitHub catalog response is not a directory listing');
    const items=entries.filter(entry=>entry.type==='dir').map(entry=>entry.name).sort();
    if(!items.length)throw new Error('No published world-item directories found');
    grid.innerHTML=items.map(id=>`<a class="card" href="view.html?item=${encodeURIComponent(id)}"><img src="items/${id}/view-hero.png" alt="${title(id)} hero render" loading="lazy"><div class="meta"><h2>${title(id)}</h2><p>${id} · Multi-angle view</p></div></a>`).join('');
  })
  .catch(error=>{grid.innerHTML=`<p class="error">商品一覧を取得できません: ${error.message}</p>`;console.error(error);});
</script></body></html>

<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VRMine World Item Gallery</title>
<style>:root{color-scheme:dark;background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:48px 24px}a{color:inherit}.eyebrow{color:#8b949e;text-transform:uppercase;letter-spacing:.12em;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:28px}.card{border:1px solid #30363d;border-radius:16px;overflow:hidden;background:#161b22;text-decoration:none}.card img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block;background:#20262e}.meta{padding:16px}.meta h2{margin:0 0 7px;font-size:18px}.meta p{margin:0;color:#8b949e;font-size:13px}</style></head>
<body><main class="wrap"><div class="eyebrow">VRMine / 3D World Item Factory</div><h1>World Item Gallery</h1><p>公開済みの3D製品を、実レンダリングから選んで多面Viewで確認できます。</p><section class="grid" id="grid"></section></main>
<script>
const items=['cafe-bar-stool-01','cafe-menu-stand-01','cafe-pendant-lamp-01','cafe-side-table-01','cafe-takeaway-cup-01','concrete-parking-block-01','minimal-photo-frame-01','minimal-wall-clock-01','open-frame-shelf-01','snake-plant-01','table-lamp-01','tissue-box-01','wood-pallet-01'];
const title=id=>id.replace(/-01$/,'').split('-').map(x=>x[0].toUpperCase()+x.slice(1)).join(' ');document.getElementById('grid').innerHTML=items.map(id=>`<a class="card" href="view.html?item=${id}"><img src="items/${id}/view-hero.png" alt="${title(id)} hero render" loading="lazy"><div class="meta"><h2>${title(id)}</h2><p>${id} · Multi-angle view</p></div></a>`).join('');
</script></body></html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Product View — VRMine</title>
<style>
:root{color-scheme:dark;background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0}a{color:inherit}.wrap{max-width:1180px;margin:auto;padding:28px 24px 64px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:28px}.back{color:#8b949e}.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:28px;align-items:center}.hero img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#161b22;border:1px solid #30363d;border-radius:18px}.eyebrow{color:#8b949e;text-transform:uppercase;letter-spacing:.12em;font-size:12px}h1{font-size:clamp(34px,5vw,64px);line-height:1;margin:.15em 0}.meta{color:#8b949e;line-height:1.7}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.btn{border:1px solid #30363d;border-radius:10px;padding:10px 14px;text-decoration:none;background:#161b22}.views{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:36px}.view{display:block;text-decoration:none;border:1px solid #30363d;border-radius:14px;overflow:hidden;background:#161b22}.view img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block}.view span{display:block;padding:10px 12px;color:#8b949e}.error{padding:28px;border:1px solid #f85149;border-radius:14px}@media(max-width:760px){.hero{grid-template-columns:1fr}.top{align-items:flex-start}}
</style>
</head>
<body><main class="wrap" id="app"><div class="top"><a class="back" href="./">← World Item Gallery</a><a href="https://github.com/KAFKA2306/vrmine">GitHub</a></div><p>読み込み中…</p></main>
<script>
(async()=>{const p=new URLSearchParams(location.search);const id=p.get('item');const app=document.getElementById('app');const safe=/^[a-z0-9-]+$/.test(id||'');if(!safe){app.insertAdjacentHTML('beforeend','<div class="error">商品IDが不正です。</div>');return}const base=`items/${id}/`;let spec={};try{const r=await fetch(base+'spec.json',{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);spec=await r.json()}catch(e){app.insertAdjacentHTML('beforeend',`<div class="error">spec.json を取得できません: ${e.message}</div>`);return}const title=spec.name||spec.title||id.split('-').map(x=>x[0].toUpperCase()+x.slice(1)).join(' ');document.title=`${title} — VRMine`;const dims=spec.dimensions||spec.size||spec.bounds||null;const dimText=dims?`<p class="meta">寸法: ${typeof dims==='string'?dims:JSON.stringify(dims)}</p>`:'';const views=[['front','Front'],['rear','Rear'],['left','Left'],['right','Right'],['top','Top'],['hero','Hero']];app.innerHTML=`<div class="top"><a class="back" href="./">← World Item Gallery</a><a href="https://github.com/KAFKA2306/vrmine">GitHub</a></div><section class="hero"><a href="${base}view-hero.png"><img src="${base}view-hero.png" alt="${title} hero render"></a><div><p class="eyebrow">VRMine / Rendered 3D Product</p><h1>${title}</h1><p class="meta">SKU: ${id}</p>${dimText}<div class="actions"><a class="btn" href="${base}${id}.glb">GLB</a><a class="btn" href="${base}${id}.fbx">FBX</a><a class="btn" href="${base}${id}.blend">Blend</a><a class="btn" href="${base}spec.json">Spec</a></div></div></section><section class="views">${views.map(([f,l])=>`<a class="view" href="${base}view-${f}.png"><img src="${base}view-${f}.png" alt="${title} ${l} view" loading="lazy"><span>${l}</span></a>`).join('')}</section>`})()
</script></body></html>

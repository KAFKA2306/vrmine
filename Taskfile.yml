version: '3'

tasks:
  cafe:build:
    desc: Generate ten Retro Cafe props, GLB/FBX, Blender scene and thumbnail with Blender 4.2
    cmds:
      - blender -b --python-exit-code 1 --python scripts/build-retro-cafe.py
      - blender -b --python-exit-code 1 --python scripts/verify-retro-cafe.py

  setup:
    desc: Install pinned repo verification tools
    cmds:
      - node scripts/install-vrc-get.mjs

  check:
    desc: Run fast reproducible repository checks available without opening Unity
    deps: [setup]
    cmds:
      - node --test pages/games/answer-impostor/engine.test.mjs
      - node scripts/verify-quality-gates.mjs
      - node scripts/verify-perspective-cage.mjs
      - node --check scripts/run-perspective-cage-unity.mjs
      - node --check scripts/run-glb-consumer-unity.mjs
      - node --check scripts/run-gaussian-unity.mjs
      - node --check scripts/open-gaussian-project.mjs
      - node scripts/verify-gaussian-fixtures.mjs
      - node scripts/verify-gaussian-exhibition.mjs
      - node scripts/verify-gaussian-video-playlist.mjs
      - node scripts/verify-vpm.mjs

  merge:check:
    desc: PR Merge Gate — run repository checks that may decide integration into main
    deps: [check]

  perspective-cage:verify-unity:
    desc: Build the canonical Perspective Cage scene twice and run its Unity verification gate
    cmds:
      - node scripts/run-perspective-cage-unity.mjs

  release:perspective-cage:u2:
    desc: Release Candidate Gate — verify pinned VRChat packages, then run exact-Unity Perspective Cage scene verification
    deps: [vpm:check]
    cmds:
      - task: perspective-cage:verify-unity

  glb:verify-u2:
    desc: Import a materialized GLB with UnityGLTF in exact Unity and persist consumer evidence
    cmds:
      - node scripts/run-glb-consumer-unity.mjs

  gaussian:renderer:
    desc: Materialize the exact pinned VRChatGaussianSplatting Unity assets without example splats/scenes
    cmds:
      - node scripts/materialize-gaussian-renderer.mjs

  gaussian:sources:
    desc: Materialize and SHA-256 verify every currently registered AutoPhotogrammetry PLY
    cmds:
      - node scripts/materialize-gaussian-sources.mjs

  gaussian:prepare:
    desc: Materialize renderer and registered PLYs, then request automatic scene preparation on next Unity open
    deps: [gaussian:renderer, gaussian:sources]
    cmds:
      - node -e "const fs=require('fs'); fs.mkdirSync('Library/VRMine',{recursive:true}); fs.writeFileSync('Library/VRMine/prepare-gaussian-on-open','1\n')"
      - echo "Prepared Gaussian inputs. Run 'task gaussian:open' to register/resolve the project in VCC and open Unity."

  gaussian:open:
    desc: Materialize Gaussian inputs, register/resolve the project in VCC, and open the pinned Unity editor
    deps: [gaussian:prepare]
    cmds:
      - node scripts/open-gaussian-project.mjs

  gaussian:verify-u2:
    desc: Run the registered-source Unity U2 verification with the project-pinned Unity editor
    cmds:
      - node scripts/run-gaussian-unity.mjs registered

  gaussian:verify-sdk:
    desc: Exercise the canonical VRChat SDK world-builder validation path in Unity
    cmds:
      - node scripts/run-gaussian-unity.mjs sdk

  gaussian:measure:
    desc: Collect current Gaussian source/import/scene size evidence in Unity
    cmds:
      - node scripts/run-gaussian-unity.mjs performance

  gaussian:verify-final:
    desc: Run the strict final 20-exhibit Unity verification; fails closed until final inputs are complete
    cmds:
      - node scripts/run-gaussian-unity.mjs final

  vpm:check:
    desc: Run VPM resolve and drift verification
    deps: [setup]
    cmds:
      - node scripts/verify-vpm.mjs

  pages:test:
    cmds:
      - node --test pages/games/answer-impostor/engine.test.mjs
      - node scripts/verify-gaussian-fixtures.mjs
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-pages.ps1

  abyss:server:
    cmds:
      - bun server/abyss-server.mjs

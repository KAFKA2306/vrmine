version: '3'

tasks:
  cafe:build:
    desc: Generate ten Retro Cafe props, GLB/FBX, Blender scene and thumbnail with Blender 4.2
    cmds:
      - blender -b --python-exit-code 1 --python scripts/build-retro-cafe.py
      - blender -b --python-exit-code 1 --python scripts/verify-retro-cafe.py

  cafe:prefabs-u2:
    desc: Generate Retro Cafe sources, then create and verify ten Prefabs in exact Unity 2022.3.22f1
    deps: [cafe:build]
    cmds:
      - node scripts/run-retro-cafe-unity.mjs

  setup:
    desc: Install pinned repo verification tools
    cmds:
      - node scripts/install-vrc-get.mjs

  check:
    desc: Run fast reproducible repository checks available without opening Unity
    deps: [setup]
    cmds:
      - node scripts/verify-quality-gates.mjs
      - node scripts/verify-factory-timing.mjs
      - node scripts/verify-world-item-packages.mjs
      - node scripts/world-item-graph.mjs --check
      - task: world-design:check
      - task: ledger:check
      - |
        if [ -f .tools/venv/pyvenv.cfg ]; then
          export UV_PYTHON=.tools/venv
        fi
        uv --cache-dir .uv-cache run --offline python -m py_compile \
          scripts/world_build_factory.py scripts/verify_world_build.py scripts/publish_world_build_evidence.py
      - node scripts/verify-perspective-cage.mjs
      - node --check scripts/run-perspective-cage-unity.mjs
      - node --check scripts/run-glb-consumer-unity.mjs
      - node --check scripts/run-world-build-unity.mjs
      - node --check scripts/run-retro-cafe-unity.mjs
      - node scripts/verify-courtyard-contracts.mjs
      - node scripts/verify-always-on-agent.mjs
      - node scripts/verify-vpm.mjs

  world-design:check:
    desc: Validate World Design source records, schema, DRC, aggregate summary and generated spec provenance
    cmds:
      - node scripts/verify-world-design.mjs
      - node scripts/world-design-to-blender-plan.mjs config/world-design/generated/cyber-alley-tea-nook.json

  courtyard:contracts:
    desc: Validate flagship Tactile Rain & Fabric Courtyard spec, Quest-first budgets, SDK 3.9.0 static bans, and benchmark definitions
    cmds:
      - node scripts/verify-courtyard-contracts.mjs

  woodland:modules:
    desc: Manufacture and verify the seven anchor modules for Woodland Tabletop Village with Blender 4.2
    cmds:
      - blender -b --python-exit-code 1 --python scripts/world_item_factory.py -- config/world-items/woodland-great-tree-01.json
      - blender -b --python-exit-code 1 --python scripts/verify_world_item.py -- config/world-items/woodland-great-tree-01.json
      - blender -b --python-exit-code 1 --python scripts/world_item_factory.py -- config/world-items/woodland-lodge-01.json
      - blender -b --python-exit-code 1 --python scripts/verify_world_item.py -- config/world-items/woodland-lodge-01.json
      - blender -b --python-exit-code 1 --python scripts/world_item_factory.py -- config/world-items/woodland-cottage-01.json
      - blender -b --python-exit-code 1 --python scripts/verify_world_item.py -- config/world-items/woodland-cottage-01.json
      - blender -b --python-exit-code 1 --python scripts/world_item_factory.py -- config/world-items/woodland-bridge-01.json
      - blender -b --python-exit-code 1 --python scripts/verify_world_item.py -- config/world-items/woodland-bridge-01.json
      - blender -b --python-exit-code 1 --python scripts/world_item_factory.py -- config/world-items/woodland-market-stall-01.json
      - blender -b --python-exit-code 1 --python scripts/verify_world_item.py -- config/world-items/woodland-market-stall-01.json
      - blender -b --python-exit-code 1 --python scripts/world_item_factory.py -- config/world-items/woodland-reading-bench-01.json
      - blender -b --python-exit-code 1 --python scripts/verify_world_item.py -- config/world-items/woodland-reading-bench-01.json
      - blender -b --python-exit-code 1 --python scripts/world_item_factory.py -- config/world-items/woodland-stream-segment-01.json
      - blender -b --python-exit-code 1 --python scripts/verify_world_item.py -- config/world-items/woodland-stream-segment-01.json
      - node scripts/verify-world-item-packages.mjs

  ledger:check:
    desc: Regenerate star-schema views in memory and fail if committed generated ledgers differ from config/star-schema.json
    cmds:
      - node scripts/generate-star-schema.mjs --check

  world-build:pilot:
    desc: Generate and verify the canonical pilot room with Blender 4.2
    cmds:
      - mkdir -p .artifacts/world-builds/cyber-alley-tea-nook
      - node scripts/world-design-to-blender-plan.mjs config/world-design/generated/cyber-alley-tea-nook.json > .artifacts/world-builds/cyber-alley-tea-nook/build-plan.json
      - blender -b --python-exit-code 1 --python scripts/world_build_factory.py -- .artifacts/world-builds/cyber-alley-tea-nook/build-plan.json .artifacts/world-builds/cyber-alley-tea-nook
      - blender -b --python-exit-code 1 --python scripts/verify_world_build.py -- .artifacts/world-builds/cyber-alley-tea-nook/build-plan.json .artifacts/world-builds/cyber-alley-tea-nook

  world-build:verify-u2:
    desc: Generate Pilot A, verify it in Blender, then import its exact GLB through the canonical Unity 2022.3.22f1 consumer verifier
    deps: [world-build:pilot]
    cmds:
      - node scripts/run-world-build-unity.mjs .artifacts/world-builds/cyber-alley-tea-nook

  merge:check:
    desc: PR Merge Gate — run repository checks that may decide integration into main
    deps: [check]

  perspective-cage:verify-unity:
    desc: Build the canonical Perspective Cage scene twice and run its Unity verification gate
    cmds:
      - node scripts/run-perspective-cage-unity.mjs

  release:perspective-cage:u2:
    desc: Release Candidate Gate — verify pinned VRChat packages, then run exact-Unity Perspective Cage scene verification
    deps: [vpm:check]
    cmds:
      - task: perspective-cage:verify-unity

  glb:verify-u2:
    desc: Import a materialized GLB with UnityGLTF in exact Unity and persist consumer evidence
    cmds:
      - node scripts/run-glb-consumer-unity.mjs

  vpm:check:
    desc: Run VPM resolve and drift verification
    deps: [setup]
    cmds:
      - node scripts/verify-vpm.mjs

  pages:test:
    cmds:
      - node scripts/verify-factory-timing.mjs
      - node scripts/verify-quality-gates.mjs
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-pages.ps1

  agent:status:
    desc: Show the Kafstyler always-on agent work ledger, human question ledger, and schedule metrics
    cmds:
      - node scripts/always-on-agent.mjs status

  agent:tick:
    desc: Run one single-writer locked always-on agent tick (deterministic probes first, LLM only on delta)
    cmds:
      - node scripts/always-on-agent.mjs tick

  agent:verify:
    desc: Run all Kafstyler always-on agent benchmark and question-ledger acceptance tests
    cmds:
      - node scripts/verify-always-on-agent.mjs

  agent:install-schedule:
    desc: Register the Windows Task Scheduler recurring job for the VRMine always-on agent and read it back
    cmds:
      - node scripts/always-on-agent.mjs install-schedule

  agent:uninstall-schedule:
    desc: Unregister the Windows Task Scheduler recurring job for the VRMine always-on agent
    cmds:
      - node scripts/always-on-agent.mjs uninstall-schedule

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrmine-vrpet"
version = "0.1.0"
description = "Local-learning VRChat pet sidecar"
requires-python = ">=3.12"
dependencies = [
  "SudachiPy",
  "SudachiDict-core",
]

[project.optional-dependencies]
voice = [
  "vosk",
  "sounddevice",
]

[project.scripts]
vrpet = "vrpet.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vrpet*"]

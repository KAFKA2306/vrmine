name: Avatar rig runtime
on:
  pull_request:
    paths:
      - 'config/avatar-rig-runtime.json'
      - 'scripts/verify-avatar-rig-runtime.mjs'
      - '.github/workflows/avatar-rig-runtime.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/verify-avatar-rig-runtime.mjs

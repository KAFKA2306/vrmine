name: Retro Cafe generation and automatic merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/*retro-cafe.py'
      - '.github/workflows/retro-cafe.yml'
      - 'Assets/KafkaMade/VRMine/RetroCafe/**'
      - 'Assets/KafkaMade/VRMine/Editor/RetroCafePrefabBuilder.cs'
      - 'Taskfile.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/*retro-cafe.py'
      - '.github/workflows/retro-cafe.yml'
      - 'Assets/KafkaMade/VRMine/RetroCafe/**'
      - 'Assets/KafkaMade/VRMine/Editor/RetroCafePrefabBuilder.cs'
      - 'Taskfile.yml'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing generated-asset PR to verify and integrate
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: retro-cafe-${{ inputs.pr_number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      final_head: ${{ steps.state.outputs.final_head }}
      head_changed: ${{ steps.state.outputs.head_changed }}
      issue_number: ${{ steps.attach.outputs.issue_number }}
      review_sha256: ${{ steps.state.outputs.review_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install official Blender 4.2.0
        if: github.event_name != 'workflow_dispatch' || inputs.pr_number == ''
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -O https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          curl --fail --location --retry 3 -O https://download.blender.org/release/Blender4.2/blender-4.2.0.sha256
          grep ' blender-4.2.0-linux-x64.tar.xz$' blender-4.2.0.sha256 | sha256sum --check --strict
          tar -xf blender-4.2.0-linux-x64.tar.xz
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri
          echo "$PWD/blender-4.2.0-linux-x64" >> "$GITHUB_PATH"

      - name: Generate Retro Cafe assets and six review viewpoints
        if: github.event_name != 'workflow_dispatch' || inputs.pr_number == ''
        run: |
          set -euo pipefail
          blender -b --python-exit-code 1 --python scripts/build-retro-cafe.py

      - name: Verify Retro Cafe generated files
        if: github.event_name != 'workflow_dispatch' || inputs.pr_number == ''
        run: |
          set -euo pipefail
          blender -b --python-exit-code 1 --python scripts/verify-retro-cafe.py
          for image in thumbnail view-hero view-front view-rear view-left view-right view-top; do
            test -s ".artifacts/retro-cafe/${image}.png"
          done

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'workflow_dispatch' || inputs.pr_number == ''
        with:
          name: retro-cafe-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/retro-cafe/
          if-no-files-found: error
          retention-days: 7

      - name: Publish immutable review renders into the PR branch
        if: github.event_name == 'pull_request'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p pages/3d/retro-cafe/review
          for image in thumbnail view-hero view-front view-rear view-left view-right view-top; do
            cp ".artifacts/retro-cafe/${image}.png" "pages/3d/retro-cafe/review/${image}.png"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/3d/retro-cafe/review
          changed=false
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish Retro Cafe review renders"
            head_ref="$(gh pr view "$PR_NUMBER" --json headRefName -q '.headRefName')"
            git push origin "HEAD:${head_ref}"
            changed=true
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - name: Record exact review state
        id: state
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ inputs.pr_number }}" ]; then
            root=pages/3d/retro-cafe/review
            head_changed=false
          else
            root=.artifacts/retro-cafe
            head_changed="${{ steps.publish.outputs.changed || 'false' }}"
          fi
          files=(
            "$root/thumbnail.png"
            "$root/view-hero.png"
            "$root/view-front.png"
            "$root/view-rear.png"
            "$root/view-left.png"
            "$root/view-right.png"
            "$root/view-top.png"
          )
          for file in "${files[@]}"; do
            test -s "$file"
            test "$(file --mime-type -b "$file")" = "image/png"
          done
          echo "final_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "head_changed=${head_changed}" >> "$GITHUB_OUTPUT"
          echo "review_sha256=$(sha256sum "${files[@]}" | sha256sum | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Attach rendered viewpoints to PR and owning Issue
        if: github.event_name == 'pull_request' || inputs.pr_number != ''
        id: attach
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REVIEW_SHA: ${{ steps.state.outputs.final_head }}
        run: |
          set -euo pipefail
          pr_body="$(gh pr view "$PR_NUMBER" --json body -q '.body // ""')"
          mapfile -t issue_matches < <(printf '%s\n' "$pr_body" | grep -oE 'Generation-Issue:[[:space:]]*#[0-9]+' | sed -E 's/.*#//' || true)
          if [ "${#issue_matches[@]}" -ne 1 ]; then
            echo "Expected exactly one Generation-Issue: #<number> marker in PR body" >&2
            exit 1
          fi
          issue_number="${issue_matches[0]}"
          gh issue view "$issue_number" >/dev/null
          echo "issue_number=${issue_number}" >> "$GITHUB_OUTPUT"

          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${REVIEW_SHA}/pages/3d/retro-cafe/review"
          cat > /tmp/gallery.md <<EOF
          <!-- retro-cafe-review:start -->
          ## Rendered result: Retro Café

          見た目はmerge判定ではありません。生成された実画像を多面からそのまま掲載します。

          | Hero | Front | Rear |
          | --- | --- | --- |
          | ![Hero](${base}/view-hero.png) | ![Front](${base}/view-front.png) | ![Rear](${base}/view-rear.png) |
          | Left | Right | Top |
          | ![Left](${base}/view-left.png) | ![Right](${base}/view-right.png) | ![Top](${base}/view-top.png) |

          Direct image root: ${base}/
          <!-- retro-cafe-review:end -->
          EOF

          printf '%s\n' "$pr_body" > /tmp/current-pr.md
          gh issue view "$issue_number" --json body -q '.body // ""' > /tmp/current-issue.md
          python3 - <<'PY'
          from pathlib import Path

          start = '<!-- retro-cafe-review:start -->'
          end = '<!-- retro-cafe-review:end -->'
          block = Path('/tmp/gallery.md').read_text().strip()

          def replace_block(source, target):
              body = Path(source).read_text()
              starts = body.count(start)
              ends = body.count(end)
              if starts != ends or starts > 1:
                  raise SystemExit(f'invalid review marker count in {source}: start={starts}, end={ends}')
              if starts == 1:
                  left, rest = body.split(start, 1)
                  _, right = rest.split(end, 1)
                  result = left.rstrip() + '\n\n' + block + right
              else:
                  result = body.rstrip() + '\n\n' + block + '\n'
              Path(target).write_text(result)

          replace_block('/tmp/current-pr.md', '/tmp/pr-body.md')
          replace_block('/tmp/current-issue.md', '/tmp/issue-body.md')
          PY
          gh pr edit "$PR_NUMBER" --body-file /tmp/pr-body.md
          gh issue edit "$issue_number" --body-file /tmp/issue-body.md

          { echo '<!-- retro-cafe-review-comment -->'; cat /tmp/gallery.md; } > /tmp/gallery-comment.md
          upsert_comment() {
            target="$1"
            marker='<!-- retro-cafe-review-comment -->'
            comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${target}/comments" --paginate --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1)"
            if [ -n "$comment_id" ]; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F body=@/tmp/gallery-comment.md >/dev/null
            else
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${target}/comments" -F body=@/tmp/gallery-comment.md >/dev/null
            fi
          }
          upsert_comment "$PR_NUMBER"
          upsert_comment "$issue_number"

      - name: Dispatch exact-head generated-asset verification
        if: github.event_name == 'pull_request' && steps.state.outputs.head_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          head_ref="$(gh pr view "$PR_NUMBER" --json headRefName -q '.headRefName')"
          gh workflow run retro-cafe.yml --ref "$head_ref" -f pr_number="$PR_NUMBER"
          echo "Generated review commit moved the PR head; exact-head integration was explicitly dispatched."

  integrate:
    needs: generate
    if: needs.generate.result == 'success' && (github.event_name == 'pull_request' || inputs.pr_number != '') && needs.generate.outputs.head_changed == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      FINAL_HEAD: ${{ needs.generate.outputs.final_head }}
      ISSUE_NUMBER: ${{ needs.generate.outputs.issue_number }}
      EXPECTED_REVIEW_SHA256: ${{ needs.generate.outputs.review_sha256 }}
    steps:
      - name: Confirm exact PR head and ready state
        run: |
          set -euo pipefail
          current_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid -q '.headRefOid')"
          test "$current_head" = "$FINAL_HEAD"
          is_draft="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isDraft -q '.isDraft')"
          if [ "$is_draft" = "true" ]; then
            gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Run Pages build against the exact PR head
        run: |
          set -euo pipefail
          head_ref="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName -q '.headRefName')"
          before_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --json databaseId --limit 1 | jq -r '.[0].databaseId // 0')"
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$head_ref" -f verify_only=true
          run_id=''
          for attempt in $(seq 1 60); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --commit "$FINAL_HEAD" --json databaseId,status,conclusion,event,headSha --limit 30)"
            failed="$(jq --arg sha "$FINAL_HEAD" --argjson before "$before_id" '[.[] | select(.event=="workflow_dispatch" and .headSha==$sha and .databaseId>$before and .status=="completed" and .conclusion!="success")] | length' <<<"$runs")"
            if [ "$failed" -gt 0 ]; then
              jq --arg sha "$FINAL_HEAD" --argjson before "$before_id" '.[] | select(.event=="workflow_dispatch" and .headSha==$sha and .databaseId>$before)' <<<"$runs"
              exit 1
            fi
            run_id="$(jq -r --arg sha "$FINAL_HEAD" --argjson before "$before_id" '[.[] | select(.event=="workflow_dispatch" and .headSha==$sha and .databaseId>$before and .status=="completed" and .conclusion=="success")][0].databaseId // empty' <<<"$runs")"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 10
          done
          test -n "$run_id"

      - name: Merge only the verified final head
        id: merge
        run: |
          set -euo pipefail
          merge_sha="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" -f merge_method=merge -f sha="$FINAL_HEAD" --jq '.sha')"
          test -n "$merge_sha"
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          test "$main_sha" = "$merge_sha"

      - name: Dispatch Pages production deployment for the merge commit
        id: production-run
        run: |
          set -euo pipefail
          merge_sha="${{ steps.merge.outputs.sha }}"
          before_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --branch main --json databaseId --limit 1 | jq -r '.[0].databaseId // 0')"
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f verify_only=false
          run_id=''
          for attempt in $(seq 1 90); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --branch main --json databaseId,status,conclusion,event,headSha --limit 40)"
            failed="$(jq --arg sha "$merge_sha" --argjson before "$before_id" '[.[] | select(.event=="workflow_dispatch" and .headSha==$sha and .databaseId>$before and .status=="completed" and .conclusion!="success")] | length' <<<"$runs")"
            if [ "$failed" -gt 0 ]; then
              jq --arg sha "$merge_sha" --argjson before "$before_id" '.[] | select(.event=="workflow_dispatch" and .headSha==$sha and .databaseId>$before)' <<<"$runs"
              exit 1
            fi
            run_id="$(jq -r --arg sha "$merge_sha" --argjson before "$before_id" '[.[] | select(.event=="workflow_dispatch" and .headSha==$sha and .databaseId>$before and .status=="completed" and .conclusion=="success")][0].databaseId // empty' <<<"$runs")"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 10
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Verify production renders directly
        id: production
        run: |
          set -euo pipefail
          base="https://kafka2306.github.io/vrmine/3d/retro-cafe"
          tmp="$(mktemp -d)"
          merge_sha="${{ steps.merge.outputs.sha }}"
          for image in thumbnail view-hero view-front view-rear view-left view-right view-top; do
            curl --fail --silent --show-error --location "${base}/${image}.png?sha=${merge_sha}" -o "${tmp}/${image}.png"
            test "$(file --mime-type -b "${tmp}/${image}.png")" = "image/png"
          done
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Post stable production gallery
        env:
          BASE: ${{ steps.production.outputs.base }}
        run: |
          set -euo pipefail
          cat > /tmp/production-gallery.md <<EOF
          ## Production rendered result

          | Hero | Front | Rear |
          | --- | --- | --- |
          | ![Hero](${BASE}/view-hero.png) | ![Front](${BASE}/view-front.png) | ![Rear](${BASE}/view-rear.png) |
          | Left | Right | Top |
          | ![Left](${BASE}/view-left.png) | ![Right](${BASE}/view-right.png) | ![Top](${BASE}/view-top.png) |

          Exact committed review hash: `${EXPECTED_REVIEW_SHA256}`
          Pages deployment run: ${{ steps.production-run.outputs.run_id }}
          EOF
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/production-gallery.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/production-gallery.md

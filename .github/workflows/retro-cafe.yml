name: World Item Factory generation and automatic merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'config/world-items/**'
      - 'scripts/world_item_factory.py'
      - 'scripts/verify_world_item.py'
      - 'pages/io/items/**'
      - '.github/workflows/retro-cafe.yml'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing world-item PR to generate/verify/integrate
        required: true
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      final_head: ${{ steps.publish.outputs.final_head }}
      sku: ${{ steps.select.outputs.sku }}
      spec_path: ${{ steps.select.outputs.spec_path }}
      issue_number: ${{ steps.select.outputs.issue_number }}
      render_sha256: ${{ steps.publish.outputs.render_sha256 }}
    steps:
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          pr_number="${EVENT_PR:-${INPUT_PR:-}}"
          test -n "$pr_number"
          gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json headRefName,headRefOid,baseRefName > /tmp/pr.json
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(jq -r .headRefName /tmp/pr.json)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r .headRefOid /tmp/pr.json)" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(jq -r .baseRefName /tmp/pr.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Select exactly one canonical SKU spec
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          mapfile -t specs < <(git diff --diff-filter=AM --name-only "origin/${BASE_REF}...HEAD" | grep -E '^config/world-items/[^/]+\.json$' || true)
          if [ "${#specs[@]}" -eq 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No added or modified canonical world-item spec; generation is not applicable to this PR."
            exit 0
          fi
          if [ "${#specs[@]}" -ne 1 ]; then
            printf 'Expected exactly one added or modified canonical world-item spec, got %s\n' "${#specs[@]}" >&2
            printf '%s\n' "${specs[@]:-}" >&2
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          spec_path="${specs[0]}"
          sku="$(jq -r '.id' "$spec_path")"
          test -n "$sku" && test "$sku" != null
          test "$(basename "$spec_path" .json)" = "$sku"
          pr_body="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body -q '.body // ""')"
          mapfile -t issues < <(printf '%s\n' "$pr_body" | grep -oE 'Generation-Issue:[[:space:]]*#[0-9]+' | sed -E 's/.*#//' || true)
          if [ "${#issues[@]}" -ne 1 ]; then
            echo 'PR body must contain exactly one Generation-Issue: #<number>' >&2
            exit 1
          fi
          gh issue view "${issues[0]}" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "spec_path=$spec_path" >> "$GITHUB_OUTPUT"
          echo "sku=$sku" >> "$GITHUB_OUTPUT"
          echo "issue_number=${issues[0]}" >> "$GITHUB_OUTPUT"

      - name: Detect current exact-head product evidence
        id: evidence
        if: steps.select.outputs.run == 'true'
        env:
          SPEC_PATH: ${{ steps.select.outputs.spec_path }}
          SKU: ${{ steps.select.outputs.sku }}
        run: |
          set -euo pipefail
          dest="pages/io/items/${SKU}"
          input_digest="$(cat "$SPEC_PATH" scripts/world_item_factory.py scripts/verify_world_item.py | sha256sum | awk '{print $1}')"
          echo "input_digest=$input_digest" >> "$GITHUB_OUTPUT"
          echo "current=false" >> "$GITHUB_OUTPUT"

          if [ -s "$dest/build-input.sha256" ] && [ "$(cat "$dest/build-input.sha256")" = "$input_digest" ]; then
            for file in thumbnail.png view-hero.png view-front.png view-rear.png view-left.png view-right.png view-top.png "$SKU.blend" "$SKU.glb" "$SKU.fbx" manifest.json factory-metrics.json spec.json render.sha256; do
              test -s "$dest/$file"
            done
            cmp -s "$SPEC_PATH" "$dest/spec.json"
            test "$(jq -r .id "$dest/manifest.json")" = "$SKU"
            test "$(jq -r .id "$dest/spec.json")" = "$SKU"
            (cd "$dest" && sha256sum --check render.sha256)
            test "$(head -c 7 "$dest/$SKU.blend")" = "BLENDER"
            test "$(head -c 4 "$dest/$SKU.glb")" = "glTF"
            render_sha="$(cd "$dest" && sha256sum thumbnail.png view-hero.png view-front.png view-rear.png view-left.png view-right.png view-top.png | sha256sum | awk '{print $1}')"
            echo "render_sha256=$render_sha" >> "$GITHUB_OUTPUT"
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "Exact-head evidence is current; Blender regeneration is not required."
          fi

      - name: Install official Blender 4.2.0
        if: steps.select.outputs.run == 'true' && steps.evidence.outputs.current != 'true'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -O https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          curl --fail --location --retry 3 -O https://download.blender.org/release/Blender4.2/blender-4.2.0.sha256
          grep ' blender-4.2.0-linux-x64.tar.xz$' blender-4.2.0.sha256 | sha256sum --check --strict
          tar -xf blender-4.2.0-linux-x64.tar.xz
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri
          echo "$PWD/blender-4.2.0-linux-x64" >> "$GITHUB_PATH"

      - name: Generate and verify canonical SKU
        if: steps.select.outputs.run == 'true' && steps.evidence.outputs.current != 'true'
        env:
          SPEC_PATH: ${{ steps.select.outputs.spec_path }}
          SKU: ${{ steps.select.outputs.sku }}
        run: |
          set -euo pipefail
          started="$(date +%s)"
          blender -b --python-exit-code 1 --python scripts/world_item_factory.py -- "$SPEC_PATH"
          blender -b --python-exit-code 1 --python scripts/verify_world_item.py -- "$SPEC_PATH"
          elapsed="$(( $(date +%s) - started ))"
          out=".artifacts/world-items/${SKU}"
          jq -n \
            --argjson production_seconds "$elapsed" \
            --argjson manual_blender_touch_count 0 \
            --argjson reusable_component_ratio 1.0 \
            --argjson parts_count "$(jq '.parts | length' "$SPEC_PATH")" \
            --arg common_components "$(jq -r '[.parts[].component] | unique | join(",")' "$SPEC_PATH")" \
            '{production_seconds:$production_seconds,manual_blender_touch_count:$manual_blender_touch_count,reusable_component_ratio:$reusable_component_ratio,parts_count:$parts_count,common_components:($common_components|split(","))}' \
            > "$out/factory-metrics.json"

      - uses: actions/upload-artifact@v4
        if: steps.select.outputs.run == 'true' && steps.evidence.outputs.current != 'true'
        with:
          name: world-item-${{ steps.select.outputs.sku }}-${{ steps.pr.outputs.head_sha }}
          path: .artifacts/world-items/${{ steps.select.outputs.sku }}/
          if-no-files-found: error
          retention-days: 7

      - name: Publish product files and multi-angle renders into PR branch
        if: steps.select.outputs.run == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          SKU: ${{ steps.select.outputs.sku }}
          SPEC_PATH: ${{ steps.select.outputs.spec_path }}
          CURRENT_EVIDENCE: ${{ steps.evidence.outputs.current }}
          CURRENT_RENDER_SHA256: ${{ steps.evidence.outputs.render_sha256 }}
        run: |
          set -euo pipefail
          if [ "$CURRENT_EVIDENCE" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "final_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "render_sha256=$CURRENT_RENDER_SHA256" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          src=".artifacts/world-items/${SKU}"
          dest="pages/io/items/${SKU}"
          mkdir -p "$dest"

          input_digest="$(cat "$SPEC_PATH" scripts/world_item_factory.py scripts/verify_world_item.py | sha256sum | awk '{print $1}')"
          published_digest="$(cat "$dest/build-input.sha256" 2>/dev/null || true)"
          if [ "$published_digest" != "$input_digest" ]; then
            for name in thumbnail view-hero view-front view-rear view-left view-right view-top; do cp "$src/${name}.png" "$dest/${name}.png"; done
            cp "$src/${SKU}.blend" "$dest/${SKU}.blend"
            cp "$src/${SKU}.glb" "$dest/${SKU}.glb"
            cp "$src/${SKU}.fbx" "$dest/${SKU}.fbx"
            cp "$src/manifest.json" "$dest/manifest.json"
            cp "$src/factory-metrics.json" "$dest/factory-metrics.json"
            cp "$SPEC_PATH" "$dest/spec.json"
            printf '%s\n' "$input_digest" > "$dest/build-input.sha256"
          fi

          for file in thumbnail.png view-hero.png view-front.png view-rear.png view-left.png view-right.png view-top.png "$SKU.blend" "$SKU.glb" "$SKU.fbx" manifest.json factory-metrics.json spec.json build-input.sha256; do
            test -s "$dest/$file"
          done
          (
            cd "$dest"
            sha256sum thumbnail.png view-hero.png view-front.png view-rear.png view-left.png view-right.png view-top.png > render.sha256
          )
          render_sha="$(cd "$dest" && sha256sum thumbnail.png view-hero.png view-front.png view-rear.png view-left.png view-right.png view-top.png | sha256sum | awk '{print $1}')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest"
          changed=false
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish ${SKU} generated product evidence"
            git push origin "HEAD:${HEAD_REF}"
            changed=true
          fi
          final_head="$(git rev-parse HEAD)"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "final_head=$final_head" >> "$GITHUB_OUTPUT"
          echo "render_sha256=$render_sha" >> "$GITHUB_OUTPUT"

      - name: Attach current rendered viewpoints to PR and Issue
        if: steps.select.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          ISSUE_NUMBER: ${{ steps.select.outputs.issue_number }}
          SKU: ${{ steps.select.outputs.sku }}
          FINAL_HEAD: ${{ steps.publish.outputs.final_head }}
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${FINAL_HEAD}/pages/io/items/${SKU}"
          start="<!-- world-item-${SKU}:start -->"
          end="<!-- world-item-${SKU}:end -->"
          cat > /tmp/block.md <<EOF
          ${start}
          ## World Item Factory: ${SKU}

          | Hero | Front | Rear |
          | --- | --- | --- |
          | ![Hero](${base}/view-hero.png) | ![Front](${base}/view-front.png) | ![Rear](${base}/view-rear.png) |
          | Left | Right | Top |
          | ![Left](${base}/view-left.png) | ![Right](${base}/view-right.png) | ![Top](${base}/view-top.png) |

          Immutable render root: ${base}/
          ${end}
          EOF
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body -q '.body // ""' > /tmp/pr-body-current.md
          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json body -q '.body // ""' > /tmp/issue-body-current.md
          python3 - <<'PY'
          import os
          from pathlib import Path
          sku=os.environ['SKU']; start=f'<!-- world-item-{sku}:start -->'; end=f'<!-- world-item-{sku}:end -->'; block=Path('/tmp/block.md').read_text().strip()
          def upsert(src,dst):
              body=Path(src).read_text(); a=body.count(start); b=body.count(end)
              if a!=b or a>1: raise SystemExit(f'invalid marker count in {src}: {a}/{b}')
              if a:
                  left,rest=body.split(start,1); _,right=rest.split(end,1); out=left.rstrip()+'\n\n'+block+right
              else: out=body.rstrip()+'\n\n'+block+'\n'
              Path(dst).write_text(out)
          upsert('/tmp/pr-body-current.md','/tmp/pr-body.md'); upsert('/tmp/issue-body-current.md','/tmp/issue-body.md')
          PY
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr-body.md
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-body.md
          marker="<!-- world-item-${SKU}:comment -->"
          { echo "$marker"; cat /tmp/block.md; } > /tmp/comment.md
          for target in "$PR_NUMBER" "$ISSUE_NUMBER"; do
            comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${target}/comments" --paginate --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n1)"
            if [ -n "$comment_id" ]; then gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F body=@/tmp/comment.md >/dev/null; else gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${target}/comments" -F body=@/tmp/comment.md >/dev/null; fi
          done

      - name: Dispatch exact-head rerun after publishing generated evidence
        if: steps.select.outputs.run == 'true' && steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          current_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid -q '.headRefOid')"
          test "$current_head" = "${{ steps.publish.outputs.final_head }}"
          gh workflow run retro-cafe.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF" -f pr_number="$PR_NUMBER"
          echo "Explicit exact-head verification dispatched for $current_head"

  integrate:
    needs: generate
    if: needs.generate.result == 'success' && needs.generate.outputs.changed == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      FINAL_HEAD: ${{ needs.generate.outputs.final_head }}
      SKU: ${{ needs.generate.outputs.sku }}
      ISSUE_NUMBER: ${{ needs.generate.outputs.issue_number }}
      RENDER_SHA256: ${{ needs.generate.outputs.render_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.generate.outputs.final_head }}
          fetch-depth: 0

      - name: Confirm this workflow run is exact PR head
        run: |
          set -euo pipefail
          current_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid -q '.headRefOid')"
          test "$current_head" = "$FINAL_HEAD"
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"
          dest="pages/io/items/${SKU}"
          (cd "$dest" && sha256sum --check render.sha256)
          current_render="$(cd "$dest" && sha256sum thumbnail.png view-hero.png view-front.png view-rear.png view-left.png view-right.png view-top.png | sha256sum | awk '{print $1}')"
          test "$current_render" = "$RENDER_SHA256"
          test -s "$dest/build-input.sha256"

      - name: Run Pages build against exact PR head
        run: |
          set -euo pipefail
          head_ref="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName -q '.headRefName')"
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$head_ref" -f verify_only=true
          run_id=''
          for attempt in $(seq 1 60); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --commit "$FINAL_HEAD" --json databaseId,status,conclusion,event,headSha --limit 20)"
            failed="$(jq --arg sha "$FINAL_HEAD" '[.[] | select(.event=="workflow_dispatch" and .headSha==$sha and .status=="completed" and .conclusion!="success")] | length' <<<"$runs")"
            if [ "$failed" -gt 0 ]; then jq --arg sha "$FINAL_HEAD" '.[] | select(.event=="workflow_dispatch" and .headSha==$sha)' <<<"$runs"; exit 1; fi
            run_id="$(jq -r --arg sha "$FINAL_HEAD" '[.[] | select(.event=="workflow_dispatch" and .headSha==$sha and .status=="completed" and .conclusion=="success")][0].databaseId // empty' <<<"$runs")"
            if [ -n "$run_id" ]; then break; fi
            sleep 10
          done
          test -n "$run_id"

      - name: Merge only verified exact head and read main back
        id: merge
        run: |
          set -euo pipefail
          merge_sha="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" -f merge_method=merge -f sha="$FINAL_HEAD" --jq '.sha')"
          test -n "$merge_sha"
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          test "$main_sha" = "$merge_sha"
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Deploy exact main to Pages
        run: |
          set -euo pipefail
          merge_sha="${{ steps.merge.outputs.sha }}"
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f verify_only=false
          run_id=''
          for attempt in $(seq 1 90); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --branch main --json databaseId,status,conclusion,event,headSha --limit 30)"
            failed="$(jq --arg sha "$merge_sha" '[.[] | select(.event=="workflow_dispatch" and .headSha==$sha and .status=="completed" and .conclusion!="success")] | length' <<<"$runs")"
            if [ "$failed" -gt 0 ]; then jq --arg sha "$merge_sha" '.[] | select(.event=="workflow_dispatch" and .headSha==$sha)' <<<"$runs"; exit 1; fi
            run_id="$(jq -r --arg sha "$merge_sha" '[.[] | select(.event=="workflow_dispatch" and .headSha==$sha and .status=="completed" and .conclusion=="success")][0].databaseId // empty' <<<"$runs")"
            if [ -n "$run_id" ]; then break; fi
            sleep 10
          done
          test -n "$run_id"

      - name: Read production gallery, product page, formats and PNGs back directly
        id: production
        run: |
          set -euo pipefail
          merge_sha="${{ steps.merge.outputs.sha }}"
          root="https://kafka2306.github.io/vrmine/io"
          item="${root}/items/${SKU}"
          tmp="$(mktemp -d)"
          spec="config/world-items/${SKU}.json"
          display_name="$(jq -r '.display_name' "$spec")"
          curl --fail --silent --show-error --location "${root}/?sha=${merge_sha}" -o "$tmp/gallery.html"
          grep -F "fetch('catalog.json'" "$tmp/gallery.html"
          curl --fail --silent --show-error --location "${root}/catalog.json?sha=${merge_sha}" -o "$tmp/catalog.json"
          jq -e --arg sku "$SKU" --arg name "$display_name" 'any(.[]; .id == $sku and .display_name == $name)' "$tmp/catalog.json" >/dev/null
          curl --fail --silent --show-error --location "${root}/view.html?item=${SKU}&sha=${merge_sha}" -o "$tmp/item.html"
          grep -F 'spec.display_name' "$tmp/item.html"
          curl --fail --silent --show-error --location "${item}/spec.json?sha=${merge_sha}" -o "$tmp/spec.json"
          jq -e --arg sku "$SKU" --arg name "$display_name" '.id == $sku and .display_name == $name' "$tmp/spec.json" >/dev/null
          for name in view-hero view-front view-rear view-left view-right view-top; do
            curl --fail --silent --show-error --location "${item}/${name}.png?sha=${merge_sha}" -o "$tmp/${name}.png"
            test "$(file --mime-type -b "$tmp/${name}.png")" = image/png
          done
          for ext in blend glb fbx; do curl --fail --silent --show-error --location "${item}/${SKU}.${ext}?sha=${merge_sha}" -o "$tmp/${SKU}.${ext}"; test -s "$tmp/${SKU}.${ext}"; done
          curl --fail --silent --show-error --location "${item}/manifest.json?sha=${merge_sha}" -o "$tmp/manifest.json"
          test "$(jq -r .id "$tmp/manifest.json")" = "$SKU"
          echo "item_url=${root}/view.html?item=${SKU}" >> "$GITHUB_OUTPUT"
          echo "asset_url=${item}/" >> "$GITHUB_OUTPUT"

      - name: Record SKU completion on Issue #200 and PR
        env:
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
          ITEM_URL: ${{ steps.production.outputs.item_url }}
          ASSET_URL: ${{ steps.production.outputs.asset_url }}
        run: |
          set -euo pipefail
          spec="config/world-items/${SKU}.json"
          price="$(jq -r '.price_hypothesis.single' "$spec")"
          metrics_url="${ASSET_URL}factory-metrics.json"
          cat > /tmp/completion.md <<EOF
          <!-- world-item-${SKU}:completion -->
          ### SKU complete: $(jq -r '.display_name' "$spec")

          - family: $(jq -r '.family' "$spec")
          - main commit: ${MERGE_SHA}
          - PR: https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}
          - gallery: https://kafka2306.github.io/vrmine/io/
          - product: ${ITEM_URL}
          - hero: ${ASSET_URL}view-hero.png
          - front: ${ASSET_URL}view-front.png
          - rear: ${ASSET_URL}view-rear.png
          - left: ${ASSET_URL}view-left.png
          - right: ${ASSET_URL}view-right.png
          - top: ${ASSET_URL}view-top.png
          - formats: BLEND / GLB / FBX verified structurally; direct production downloads read back
          - geometry: PASS; render PNG: PASS; exact-head Pages build: PASS; exact main read-back: PASS; production Pages: PASS
          - price hypothesis: ¥${price}
          - unity_status: UNVERIFIED
          - vrchat_status: UNVERIFIED
          - booth_status: UNVERIFIED
          - reused common parts: $(jq -r '[.parts[].component] | unique | join(", ")' "$spec")
          - factory metrics: ${metrics_url}
          EOF
          marker="<!-- world-item-${SKU}:completion -->"
          for target in "$ISSUE_NUMBER" "$PR_NUMBER"; do
            comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${target}/comments" --paginate --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n1)"
            if [ -n "$comment_id" ]; then gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F body=@/tmp/completion.md >/dev/null; else gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${target}/comments" -F body=@/tmp/completion.md >/dev/null; fi
          done

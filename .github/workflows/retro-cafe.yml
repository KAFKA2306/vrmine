name: Retro Cafe generation

on:
  pull_request:
    paths: ['scripts/*retro-cafe.py', '.github/workflows/retro-cafe.yml', 'Taskfile.yml']
  push:
    branches: [main]
    paths: ['scripts/*retro-cafe.py', '.github/workflows/retro-cafe.yml', 'Taskfile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install bpy==4.2.0
      - run: python scripts/build-retro-cafe.py
      - run: python scripts/verify-retro-cafe.py
      - uses: actions/upload-artifact@v4
        with:
          name: retro-cafe-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/retro-cafe/
          if-no-files-found: error
          retention-days: 7

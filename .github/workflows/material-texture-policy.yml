name: Material texture policy

on:
  pull_request:
    paths:
      - 'config/material-texture-policy.json'
      - 'scripts/verify-material-texture-policy.mjs'
      - 'scripts/material-texture-policy.test.mjs'
      - '.github/workflows/material-texture-policy.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-material-texture-policy.mjs
      - run: node --test scripts/material-texture-policy.test.mjs

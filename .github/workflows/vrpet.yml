name: VRPet core

on:
  pull_request:
    paths:
      - "tools/vr-pet/**"
      - ".github/workflows/vrpet.yml"
  push:
    branches: [main]
    paths:
      - "tools/vr-pet/**"
      - ".github/workflows/vrpet.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/vr-pet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests

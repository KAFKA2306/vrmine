name: Production router contract

on:
  pull_request:
    paths:
      - 'config/production-request.schema.json'
      - 'config/capability-registry.json'
      - 'config/production-stage-graph.json'
      - 'config/production-run-state.schema.json'
      - 'scripts/route-production-request.mjs'
      - 'scripts/plan-production-request.mjs'
      - 'scripts/production-run-state.mjs'
      - 'scripts/production-executor.mjs'
      - 'scripts/production-router.test.mjs'
      - 'scripts/production-planner.test.mjs'
      - 'scripts/production-run-state.test.mjs'
      - 'scripts/production-executor.test.mjs'
      - '.github/workflows/production-router-contract.yml'
  push:
    branches: [main]
    paths:
      - 'config/production-request.schema.json'
      - 'config/capability-registry.json'
      - 'config/production-stage-graph.json'
      - 'config/production-run-state.schema.json'
      - 'scripts/route-production-request.mjs'
      - 'scripts/plan-production-request.mjs'
      - 'scripts/production-run-state.mjs'
      - 'scripts/production-executor.mjs'
      - 'scripts/production-router.test.mjs'
      - 'scripts/production-planner.test.mjs'
      - 'scripts/production-run-state.test.mjs'
      - 'scripts/production-executor.test.mjs'
      - '.github/workflows/production-router-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove exact checkout
        shell: bash
        run: |
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - name: Syntax check orchestrator control plane
        run: |
          node --check scripts/route-production-request.mjs
          node --check scripts/plan-production-request.mjs
          node --check scripts/production-run-state.mjs
          node --check scripts/production-executor.mjs
      - name: Run focused orchestrator contracts
        run: node --test scripts/production-router.test.mjs scripts/production-planner.test.mjs scripts/production-run-state.test.mjs scripts/production-executor.test.mjs

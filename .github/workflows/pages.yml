name: Build and deploy VRMine Pages

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "scripts/verify-repository-ratchet.mjs"
      - "README.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "pages/**"
      - "scripts/verify-repository-ratchet.mjs"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vrmine-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify canonical repository flow
        run: node scripts/verify-repository-ratchet.mjs

      - name: Test game logic
        run: node --test pages/games/answer-impostor/engine.test.mjs

      - name: Validate static game hub
        run: |
          set -euo pipefail
          required=(
            pages/index.html
            pages/assets/styles.css
            pages/assets/app.js
            pages/assets/platform.js
            pages/games/registry.js
            pages/games/answer-impostor/index.html
            pages/games/answer-impostor/game.js
            pages/games/answer-impostor/engine.mjs
            pages/games/abyss-invasion/index.html
            pages/games/abyss-invasion/tracker.js
            server/abyss-server.mjs
            pages/games/stich-meister/index.html
            pages/service-worker.js
          )
          for file in "${required[@]}"; do test -s "$file"; done
          find pages -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --check server/abyss-server.mjs
          grep -F 'vrmine-game-hub-2026-07-26-1' pages/index.html
          grep -F 'Answer Impostor' pages/games/answer-impostor/index.html
          grep -F '深淵侵蝕' pages/games/abyss-invasion/index.html
          grep -F 'Stich-Meister' pages/games/stich-meister/index.html
          grep -F "href: './games/answer-impostor/'" pages/games/registry.js
          grep -F "href: './games/abyss-invasion/'" pages/games/registry.js
          grep -F 'new WebSocket(server)' pages/games/abyss-invasion/tracker.js
          grep -F 'vrmine-game-hub-v2' pages/service-worker.js

      - name: Assemble Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          cp -R pages _site
          cp pages/index.html _site/404.html
          touch _site/.nojekyll

      - name: Detect GitHub Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error -o pages-config.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            jq '{html_url, build_type, source, public}' pages-config.json
          elif [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### GitHub Pages requires one-time repository enablement" >> "$GITHUB_STEP_SUMMARY"
            echo "Open Settings → Pages and select GitHub Actions as the source, then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
          else
            cat pages-config.json
            exit 1
          fi

      - name: Configure Pages
        if: github.event_name != 'pull_request' && steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public game hub
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          tmp="$(mktemp -d)"
          matched=false
          for attempt in $(seq 1 36); do
            curl --fail --silent --show-error --location "$base/?smoke=${EXPECTED_SHA}-${attempt}" -o "$tmp/index.html"
            if grep -Fq 'vrmine-game-hub-2026-07-26-1' "$tmp/index.html"; then
              matched=true
              break
            fi
            sleep 10
          done
          test "$matched" = true
          curl --fail --silent --show-error --location "$base/games/answer-impostor/?smoke=${EXPECTED_SHA}" -o "$tmp/answer.html"
          curl --fail --silent --show-error --location "$base/games/abyss-invasion/?smoke=${EXPECTED_SHA}" -o "$tmp/abyss.html"
          curl --fail --silent --show-error --location "$base/games/stich-meister/?smoke=${EXPECTED_SHA}" -o "$tmp/stich.html"
          curl --fail --silent --show-error --location "$base/games/answer-impostor/engine.mjs?smoke=${EXPECTED_SHA}" -o "$tmp/engine.mjs"
          curl --fail --silent --show-error --location "$base/games/abyss-invasion/tracker.js?smoke=${EXPECTED_SHA}" -o "$tmp/abyss.js"
          grep -F 'Answer Impostor' "$tmp/answer.html"
          grep -F '深淵侵蝕' "$tmp/abyss.html"
          grep -F 'Stich-Meister' "$tmp/stich.html"
          grep -F 'scoreRound' "$tmp/engine.mjs"
          grep -F 'new WebSocket(server)' "$tmp/abyss.js"
          echo "Live VRMine game hub verification passed: $base/"

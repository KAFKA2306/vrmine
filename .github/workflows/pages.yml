name: Build and deploy VRMine Pages

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vrmine-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate landing page
        run: |
          set -euo pipefail
          test -s pages/index.html
          test -s pages/styles.css
          test -s pages/app.js
          node --check pages/app.js
          grep -F '2026-07-23-pastel-watercolor-1' pages/index.html
          grep -F 'data-component="current-world"' pages/index.html
          grep -F 'data-component="system-flow"' pages/index.html
          grep -F 'docs/Rulebook.md' pages/index.html
          grep -F 'docs/STATE.md' pages/index.html
          grep -F 'docs/ARCHITECTURE_RULES.md' pages/index.html
          grep -F -- '--lavender:' pages/styles.css
          grep -F -- '--rose:' pages/styles.css
          grep -F -- '--mint:' pages/styles.css

      - name: Assemble Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp pages/index.html pages/styles.css pages/app.js _site/
          cp pages/index.html _site/404.html
          touch _site/.nojekyll

      - name: Detect GitHub Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error -o pages-config.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            jq '{html_url, build_type, source, public}' pages-config.json
          elif [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### GitHub Pages requires one-time repository enablement" >> "$GITHUB_STEP_SUMMARY"
            echo "The site artifact is valid, but Pages is not configured for this repository." >> "$GITHUB_STEP_SUMMARY"
            echo "Open Settings → Pages and select GitHub Actions as the source, then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
          else
            cat pages-config.json
            exit 1
          fi

      - name: Configure Pages
        if: github.event_name != 'pull_request' && steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the real public landing page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          base="${PAGE_URL%/}"
          tmp="$(mktemp -d)"
          matched=false
          for attempt in $(seq 1 36); do
            curl --fail --silent --show-error --location \
              "$base/?smoke=${EXPECTED_SHA}-${attempt}" -o "$tmp/index.html"
            if grep -Fq '2026-07-23-pastel-watercolor-1' "$tmp/index.html"; then
              matched=true
              break
            fi
            sleep 10
          done
          test "$matched" = true

          curl --fail --silent --show-error --location "$base/styles.css?smoke=${EXPECTED_SHA}" -o "$tmp/styles.css"
          curl --fail --silent --show-error --location "$base/app.js?smoke=${EXPECTED_SHA}" -o "$tmp/app.js"

          grep -F 'data-component="current-world"' "$tmp/index.html"
          grep -F 'data-component="system-flow"' "$tmp/index.html"
          grep -F 'VRMine &gt; build_visuals' "$tmp/index.html"
          grep -F 'VRMine &gt; wire_scene' "$tmp/index.html"
          grep -F 'docs/Rulebook.md' "$tmp/index.html"
          grep -F 'docs/STATE.md' "$tmp/index.html"
          grep -F 'docs/ARCHITECTURE_RULES.md' "$tmp/index.html"
          grep -F -- '--lavender:' "$tmp/styles.css"
          grep -F -- '--rose:' "$tmp/styles.css"
          grep -F -- '--mint:' "$tmp/styles.css"
          grep -F 'IntersectionObserver' "$tmp/app.js"

          echo "Live VRMine Pages verification passed: $base/"

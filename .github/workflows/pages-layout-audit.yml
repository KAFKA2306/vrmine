name: Inspect current VRMine Pages

on:
  pull_request:
    paths:
      - ".github/workflows/pages-layout-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            | tee pages-config.json \
            | jq '{html_url, status, build_type, source, public}'

      - name: Inspect public landing page
        shell: bash
        run: |
          set -euo pipefail
          base="https://kafka2306.github.io/vrmine"
          curl --fail --silent --show-error --location -D headers.txt "$base/?audit=${GITHUB_SHA}" -o page.html
          echo "=== response headers ==="
          sed -n '1,30p' headers.txt
          echo "=== title and metadata ==="
          grep -nE '<title>|theme-color|app-build|description' page.html || true
          echo "=== headings ==="
          grep -oE '<h[1-3][^>]*>[^<]+' page.html | head -40 || true
          echo "=== local links ==="
          grep -oE 'href="[^"]+"' page.html | sed 's/^href=//' | sort -u | head -80 || true
          echo "=== asset references ==="
          grep -oE '(src|href)="[^"]+\.(css|js)"' page.html | head -40 || true
          test -s page.html

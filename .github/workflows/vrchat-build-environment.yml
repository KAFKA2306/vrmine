name: VRChat build environment
on:
  pull_request:
    paths:
      - 'config/vrchat-build-environment.json'
      - 'config/vrchat-toolchain.json'
      - 'Packages/**'
      - 'ProjectSettings/ProjectVersion.txt'
      - 'scripts/verify-vrchat-build-environment.mjs'
      - 'scripts/verify-vpm.mjs'
      - '.github/workflows/vrchat-build-environment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned build contract
        run: node scripts/verify-vrchat-build-environment.mjs
      - name: Install pinned vrc-get
        run: node scripts/install-vrc-get.mjs
      - name: Resolve and verify VPM lock without drift
        run: node scripts/verify-vpm.mjs
      - name: Upload exact-revision dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: vrchat-build-environment-u1
          path: .artifacts/vpm-u1.json
          if-no-files-found: error

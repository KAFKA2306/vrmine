name: Measure all 3DGS source fixtures

on:
  pull_request:
    paths:
      - ".github/workflows/gaussian-all-source-hashes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download exact sources and measure SHA-256
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/KAFKA2306/AutoPhotogrammetry/1fa7f35b1fc9fce669f97d5ec7c7f46ce4601206"
          entries=(
            "avenida-gomez-morin|output/avenida-gomez-morin/runs/splatfacto/20260818T115533Z-0c8cba41/export/splat.ply"
            "baluarte-san-pedro|output/baluarte-san-pedro/runs/splatfacto/20260818T122646Z-30b321b1/export/splat.ply"
            "calvillo-centro|output/calvillo-centro/runs/splatfacto/20260818T113322Z-4b6c4e2d/export/splat.ply"
            "huejotzingo|output/huejotzingo/runs/splatfacto/20260818T111922Z-6381bd35/export/splat.ply"
            "puente-san-ignacio-01|output/puente-san-ignacio-01/runs/splatfacto/20260818T142759Z-fcdd4004/export/splat.ply"
            "puente-san-ignacio-03|output/puente-san-ignacio-03/runs/splatfacto/20260818T115039Z-61769172/export/splat.ply"
            "san-francisco-nayarit-01|output/san-francisco-nayarit-01/runs/splatfacto/20260818T122233Z-fc38e1b8/export/splat.ply"
            "templo-san-marcos|output/templo-san-marcos/runs/splatfacto/20260818T113006Z-65cd5384/export/splat.ply"
            "tepotzotlan-virreinato|output/tepotzotlan-virreinato/runs/splatfacto/20260818T112435Z-8a6bbe08/export/splat.ply"
          )
          printf 'id\tbytes\tsha256\tpath\n' | tee /tmp/gaussian-sources.tsv
          for entry in "${entries[@]}"; do
            IFS='|' read -r id path <<< "$entry"
            file="/tmp/${id}.ply"
            curl --fail --location --retry 3 --silent --show-error --output "$file" "$base/$path"
            bytes="$(stat -c '%s' "$file")"
            sha256="$(sha256sum "$file" | cut -d' ' -f1)"
            printf '%s\t%s\t%s\t%s\n' "$id" "$bytes" "$sha256" "$path" | tee -a /tmp/gaussian-sources.tsv
            rm "$file"
          done
          {
            echo '## AutoPhotogrammetry 3DGS source hashes'
            echo '```text'
            cat /tmp/gaussian-sources.tsv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

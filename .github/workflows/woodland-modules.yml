name: Woodland Village Module Factory

on:
  push:
    branches: [main]
    paths:
      - 'config/world-items/woodland-*.json'
      - 'config/world-item-packages.json'
      - 'scripts/world_item_factory.py'
      - 'scripts/verify_world_item.py'
      - '.github/workflows/woodland-modules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: woodland-module-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manufacture:
    name: Manufacture ${{ matrix.sku }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - sku: woodland-great-tree-01
          - sku: woodland-lodge-01
          - sku: woodland-cottage-01
          - sku: woodland-bridge-01
          - sku: woodland-market-stall-01
          - sku: woodland-reading-bench-01
          - sku: woodland-stream-segment-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/cache@v4
        id: blender-cache
        with:
          path: blender-4.2.0-linux-x64
          key: blender-4.2.0-linux-x64-official

      - name: Install verified Blender 4.2.0
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -O https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          curl --fail --location --retry 3 -O https://download.blender.org/release/Blender4.2/blender-4.2.0.sha256
          grep ' blender-4.2.0-linux-x64.tar.xz$' blender-4.2.0.sha256 | sha256sum --check --strict
          tar -xf blender-4.2.0-linux-x64.tar.xz
          test -x blender-4.2.0-linux-x64/blender

      - name: Prepare Blender runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri
          test -x blender-4.2.0-linux-x64/blender
          echo "$PWD/blender-4.2.0-linux-x64" >> "$GITHUB_PATH"

      - name: Generate and verify module
        env:
          SKU: ${{ matrix.sku }}
        run: |
          set -euo pipefail
          spec="config/world-items/${SKU}.json"
          blender -b --python-exit-code 1 --python scripts/world_item_factory.py -- "$spec"
          blender -b --python-exit-code 1 --python scripts/verify_world_item.py -- "$spec"
          test -s ".artifacts/world-items/${SKU}/${SKU}.glb"
          test -s ".artifacts/world-items/${SKU}/${SKU}.fbx"
          test -s ".artifacts/world-items/${SKU}/${SKU}.blend"
          test -s ".artifacts/world-items/${SKU}/view-hero.png"

      - uses: actions/upload-artifact@v4
        with:
          name: woodland-module-${{ matrix.sku }}
          path: .artifacts/world-items/${{ matrix.sku }}
          if-no-files-found: error
          retention-days: 14

  contract:
    name: Verify Woodland package contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: node scripts/verify-world-item-packages.mjs
      - run: node scripts/world-item-graph.mjs --check

  gate:
    name: Woodland Module Factory Gate
    needs: [manufacture, contract]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require all manufacturing checks
        env:
          MANUFACTURE: ${{ needs.manufacture.result }}
          CONTRACT: ${{ needs.contract.result }}
        run: |
          set -euo pipefail
          test "$MANUFACTURE" = success
          test "$CONTRACT" = success

name: Measure 3DGS source fixture

on:
  pull_request:
    paths:
      - ".github/workflows/gaussian-source-hash.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download exact Huejotzingo source and measure SHA-256
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/KAFKA2306/AutoPhotogrammetry/1fa7f35b1fc9fce669f97d5ec7c7f46ce4601206/output/huejotzingo/runs/splatfacto/20260818T111922Z-6381bd35/export/splat.ply"
          curl --fail --location --retry 3 --output /tmp/huejotzingo-splat.ply "$url"
          bytes="$(stat -c '%s' /tmp/huejotzingo-splat.ply)"
          sha256="$(sha256sum /tmp/huejotzingo-splat.ply | cut -d' ' -f1)"
          echo "bytes=$bytes"
          echo "sha256=$sha256"
          {
            echo "## Huejotzingo source fixture"
            echo "- bytes: $bytes"
            echo "- sha256: $sha256"
          } >> "$GITHUB_STEP_SUMMARY"

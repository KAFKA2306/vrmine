name: Project integrity

on:
  push:
    branches: [main, agent/vrchat-release-readiness]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify repository links, versions, rules, and fail-closed gates
        shell: bash
        run: |
          set -o pipefail
          python3 tools/verify_project.py 2>&1 | tee integrity-report.txt

      - name: Verify UdonSharp proxy persistence hook
        shell: bash
        run: |
          set -euo pipefail
          file=Assets/KafkaMade/VRMine/Editor/VRMineUdonProxySaveProcessor.cs
          test -f "$file"
          grep -F 'OnWillSaveAssets' "$file"
          grep -F 'ApplyProxyModifications' "$file"
          grep -F 'BoardGameShowcase.unity' "$file"

      - name: Upload integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-integrity-report
          path: integrity-report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Build public evidence status
        run: python3 tools/build_site_status.py

      - name: Validate public status JSON
        run: python3 -m json.tool site/status.json >/dev/null

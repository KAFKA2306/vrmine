name: Astra Pilot A Unity evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/astra-pilot-a-unity.yml'
      - 'scripts/run-world-build-unity.mjs'
      - 'scripts/run-glb-consumer-unity.mjs'
      - 'Assets/Editor/GlbConsumerVerification.cs'
      - 'pages/worlds/cyber-alley-tea-nook/**'
      - 'Packages/**'
      - 'ProjectSettings/ProjectVersion.txt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/astra-pilot-a-unity.yml'
      - 'scripts/run-world-build-unity.mjs'
      - 'scripts/run-glb-consumer-unity.mjs'
      - 'Assets/Editor/GlbConsumerVerification.cs'
      - 'pages/worlds/cyber-alley-tea-nook/**'
      - 'Packages/**'
      - 'ProjectSettings/ProjectVersion.txt'

permissions:
  contents: read

jobs:
  pilot-a-unity:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      UNITY_EXE: C:\Program Files\Unity\Hub\Editor\2022.3.22f1\Editor\Unity.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Require exact revision and pinned Unity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Checkout is not exact requested revision: expected $expected, got $actual" }
          if (!(Test-Path -LiteralPath $env:UNITY_EXE)) { throw "Unity editor not found: $env:UNITY_EXE" }
          $projectVersion = ((Get-Content -LiteralPath 'ProjectSettings\ProjectVersion.txt' | Select-String '^m_EditorVersion:').Line -split ': ', 2)[1]
          if ($projectVersion -ne '2022.3.22f1') { throw "Project Unity version drift: $projectVersion" }
          & $env:UNITY_EXE -version -batchmode -quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve pinned VRChat packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/install-vrc-get.mjs
          & .tools\vrc-get.exe resolve
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify tracked Pilot A artifact in canonical Unity
        shell: pwsh
        run: node scripts/run-world-build-unity.mjs pages/worlds/cyber-alley-tea-nook

      - name: Persist exact-revision Pilot A Unity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: astra-pilot-a-unity-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            pages/worlds/cyber-alley-tea-nook/unity-evidence/glb-consumer-evidence.json
            pages/worlds/cyber-alley-tea-nook/unity-evidence/glb-consumer-*.log
          if-no-files-found: error
          retention-days: 14

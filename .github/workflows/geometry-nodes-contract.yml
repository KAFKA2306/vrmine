name: Geometry Nodes contract

on:
  pull_request:
    paths:
      - 'config/geometry-nodes-generation.json'
      - 'scripts/generate-geometry-nodes-pilots.py'
      - 'scripts/verify-geometry-nodes-generation.mjs'
      - '.github/workflows/geometry-nodes-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/generate-geometry-nodes-pilots.py
      - run: node scripts/verify-geometry-nodes-generation.mjs

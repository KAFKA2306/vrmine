name: Benchmark Blender archive cache

on:
  push:
    paths:
      - '.github/workflows/blender-cache-benchmark.yml'
  pull_request:
    paths:
      - '.github/workflows/blender-cache-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-no-cache:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Measure uncached Blender setup
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s)
          work="$RUNNER_TEMP/blender-baseline"
          mkdir -p "$work"
          cd "$work"
          curl --fail --location --retry 3 -o blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          curl --fail --location --retry 3 -o blender.sha256 https://download.blender.org/release/Blender4.2/blender-4.2.0.sha256
          expected=$(grep ' blender-4.2.0-linux-x64.tar.xz$' blender.sha256 | awk '{print $1}')
          printf '%s  %s\n' "$expected" blender.tar.xz | sha256sum --check --strict
          tar -xf blender.tar.xz
          sudo apt-get update >/dev/null
          sudo apt-get install -y libegl1 libgl1-mesa-dri >/dev/null
          "$work/blender-4.2.0-linux-x64/blender" --version | head -n1
          elapsed=$(( $(date +%s) - started ))
          echo "baseline_setup_seconds=$elapsed" | tee -a "$GITHUB_STEP_SUMMARY"

  cached-archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve official Blender digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender-cache-proof"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/blender-cache-proof/blender.sha256" https://download.blender.org/release/Blender4.2/blender-4.2.0.sha256
          expected=$(grep ' blender-4.2.0-linux-x64.tar.xz$' "$RUNNER_TEMP/blender-cache-proof/blender.sha256" | awk '{print $1}')
          test -n "$expected"
          echo "sha256=$expected" >> "$GITHUB_OUTPUT"
      - name: Restore Blender archive cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vrmine-blender/blender-4.2.0-linux-x64.tar.xz
          key: blender-${{ runner.os }}-x64-4.2.0-${{ steps.digest.outputs.sha256 }}
      - name: Measure cached Blender setup
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          EXPECTED_SHA256: ${{ steps.digest.outputs.sha256 }}
        run: |
          set -euo pipefail
          started=$(date +%s)
          archive="$HOME/.cache/vrmine-blender/blender-4.2.0-linux-x64.tar.xz"
          mkdir -p "$(dirname "$archive")"
          if [ "$CACHE_HIT" != "true" ]; then
            curl --fail --location --retry 3 -o "$archive" https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          fi
          printf '%s  %s\n' "$EXPECTED_SHA256" "$archive" | sha256sum --check --strict
          work="$RUNNER_TEMP/blender-cached"
          mkdir -p "$work"
          tar -xf "$archive" -C "$work"
          sudo apt-get update >/dev/null
          sudo apt-get install -y libegl1 libgl1-mesa-dri >/dev/null
          "$work/blender-4.2.0-linux-x64/blender" --version | head -n1
          elapsed=$(( $(date +%s) - started ))
          echo "cache_hit=$CACHE_HIT" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "cached_setup_seconds=$elapsed" | tee -a "$GITHUB_STEP_SUMMARY"

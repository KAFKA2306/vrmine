name: World lighting rendering
on:
  pull_request:
    paths:
      - 'config/world-lighting-rendering.json'
      - 'scripts/verify-world-lighting-rendering.mjs'
      - '.github/workflows/world-lighting-rendering.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/verify-world-lighting-rendering.mjs

name: Repository U1 verification

on:
  push:
    branches: [main]
    paths:
      - "Packages/**"
      - "ProjectSettings/ProjectVersion.txt"
      - "config/vrchat-toolchain.json"
      - "config/perspective-cage.json"
      - "Assets/KafkaMade/VRMine/Puzzles/PerspectiveCage/**"
      - "scripts/install-vrc-get.mjs"
      - "scripts/verify-vpm.mjs"
      - "scripts/verify-perspective-cage.mjs"
      - "scripts/run-perspective-cage-unity.mjs"
      - "Taskfile.yml"
      - ".github/workflows/unity-vpm.yml"
  pull_request:
    paths:
      - "Packages/**"
      - "ProjectSettings/ProjectVersion.txt"
      - "config/vrchat-toolchain.json"
      - "config/perspective-cage.json"
      - "Assets/KafkaMade/VRMine/Puzzles/PerspectiveCage/**"
      - "scripts/install-vrc-get.mjs"
      - "scripts/verify-vpm.mjs"
      - "scripts/verify-perspective-cage.mjs"
      - "scripts/run-perspective-cage-unity.mjs"
      - "Taskfile.yml"
      - ".github/workflows/unity-vpm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vrmine-u1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  u1:
    name: U1 static contracts and VPM
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify Perspective Cage contract and implementation shape
        run: node scripts/verify-perspective-cage.mjs

      - name: Syntax-check Perspective Cage Unity runner
        run: node --check scripts/run-perspective-cage-unity.mjs

      - name: Install pinned vrc-get
        run: node scripts/install-vrc-get.mjs

      - name: Verify VPM package graph
        run: node scripts/verify-vpm.mjs

      - name: Publish U1 evidence summary
        if: always()
        shell: bash
        run: |
          if [ -f .artifacts/vpm-u1.json ]; then
            {
              echo '## VRMine U1 evidence'
              echo '```json'
              cat .artifacts/vpm-u1.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

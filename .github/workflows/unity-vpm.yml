name: PR Merge Gate — Repository U1

on:
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "README.md"
      - "Packages/**"
      - "ProjectSettings/ProjectVersion.txt"
      - "config/vrchat-toolchain.json"
      - "config/quality-gates.json"
      - "config/perspective-cage.json"
      - "config/factory-timing.json"
      - "config/world-design/**"
      - "Assets/KafkaMade/VRMine/Puzzles/PerspectiveCage/**"
      - "Assets/KafkaMade/VRMine/Editor/GlbConsumerVerification.cs"
      - "Assets/KafkaMade/VRMine/Editor/RetroCafePrefabBuilder.cs"
      - "Assets/KafkaMade/VRMine/Editor/RetroCafePrefabBuilder.cs.meta"
      - "docs/QUALITY_GATES.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "scripts/install-vrc-get.mjs"
      - "scripts/verify-vpm.mjs"
      - "scripts/verify-quality-gates.mjs"
      - "scripts/verify-factory-timing.mjs"
      - "scripts/verify-world-design.mjs"
      - "scripts/verify-perspective-cage.mjs"
      - "scripts/run-perspective-cage-unity.mjs"
      - "scripts/run-glb-consumer-unity.mjs"
      - "scripts/run-retro-cafe-unity.mjs"
      - "Taskfile.yml"
      - "skills/**"
      - "agr.toml"
      - "agr.lock"
      - ".github/workflows/unity-vpm.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "Packages/**"
      - "ProjectSettings/ProjectVersion.txt"
      - "config/vrchat-toolchain.json"
      - "config/quality-gates.json"
      - "config/perspective-cage.json"
      - "config/factory-timing.json"
      - "config/world-design/**"
      - "Assets/KafkaMade/VRMine/Puzzles/PerspectiveCage/**"
      - "Assets/KafkaMade/VRMine/Editor/GlbConsumerVerification.cs"
      - "Assets/KafkaMade/VRMine/Editor/RetroCafePrefabBuilder.cs"
      - "Assets/KafkaMade/VRMine/Editor/RetroCafePrefabBuilder.cs.meta"
      - "docs/QUALITY_GATES.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "scripts/install-vrc-get.mjs"
      - "scripts/verify-vpm.mjs"
      - "scripts/verify-quality-gates.mjs"
      - "scripts/verify-factory-timing.mjs"
      - "scripts/verify-world-design.mjs"
      - "scripts/verify-perspective-cage.mjs"
      - "scripts/run-perspective-cage-unity.mjs"
      - "scripts/run-glb-consumer-unity.mjs"
      - "scripts/run-retro-cafe-unity.mjs"
      - "Taskfile.yml"
      - "skills/**"
      - "agr.toml"
      - "agr.lock"
      - ".github/workflows/unity-vpm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vrmine-merge-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  u1:
    name: PR Merge Gate — U1 static contracts and VPM
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify repository and quality gate contracts
        run: node scripts/verify-quality-gates.mjs

      - name: Verify World Item Factory timing evidence
        run: node scripts/verify-factory-timing.mjs

      - name: Verify World Design dataset, DRC and provenance
        run: node scripts/verify-world-design.mjs

      - name: Verify Perspective Cage contract and implementation shape
        run: node scripts/verify-perspective-cage.mjs

      - name: Syntax-check Unity runners
        run: |
          node --check scripts/run-perspective-cage-unity.mjs
          node --check scripts/run-glb-consumer-unity.mjs
          node --check scripts/run-retro-cafe-unity.mjs

      - name: Install pinned vrc-get
        run: node scripts/install-vrc-get.mjs

      - name: Verify VPM package graph
        run: node scripts/verify-vpm.mjs

      - name: Publish merge-gate evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo '## VRMine PR Merge Gate'
            echo 'This workflow decides repository integration only. It does not claim Unity/SDK/actual-client release readiness.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f .artifacts/vpm-u1.json ]; then
            {
              echo '```json'
              cat .artifacts/vpm-u1.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

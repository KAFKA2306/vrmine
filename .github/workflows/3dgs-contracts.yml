name: 3DGS contracts

on:
  push:
    branches: [main]
    paths:
      - "Assets/KafkaMade/VRMine/Editor/GaussianSplatBatchImporter.cs"
      - "Assets/KafkaMade/VRMine/Editor/GaussianImportOverrides.cs"
      - "Assets/KafkaMade/VRMine/Editor/GaussianExhibition*.cs"
      - "config/gaussian-*.json"
      - "config/gaussian-artifacts.yaml"
      - "scripts/verify-gaussian-*.mjs"
      - "scripts/materialize-gaussian-*.mjs"
      - "scripts/compile-gaussian-producer-orientation.mjs"
      - "scripts/test-gaussian-producer-orientation.mjs"
      - "scripts/gaussian_orientation.py"
      - "scripts/test_gaussian_orientation.py"
      - "scripts/open-gaussian-project.mjs"
      - "scripts/open-unity-windows.ps1"
      - "Taskfile.yml"
      - ".github/workflows/3dgs-contracts.yml"
  pull_request:
    paths:
      - "Assets/KafkaMade/VRMine/Editor/GaussianSplatBatchImporter.cs"
      - "Assets/KafkaMade/VRMine/Editor/GaussianImportOverrides.cs"
      - "Assets/KafkaMade/VRMine/Editor/GaussianExhibition*.cs"
      - "config/gaussian-*.json"
      - "config/gaussian-artifacts.yaml"
      - "scripts/verify-gaussian-*.mjs"
      - "scripts/materialize-gaussian-*.mjs"
      - "scripts/compile-gaussian-producer-orientation.mjs"
      - "scripts/test-gaussian-producer-orientation.mjs"
      - "scripts/gaussian_orientation.py"
      - "scripts/test_gaussian_orientation.py"
      - "scripts/open-gaussian-project.mjs"
      - "scripts/open-unity-windows.ps1"
      - "Taskfile.yml"
      - ".github/workflows/3dgs-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check script syntax
        run: |
          node --check scripts/verify-gaussian-fixtures.mjs
          node --check scripts/verify-gaussian-exhibition.mjs
          node --check scripts/verify-gaussian-presentation.mjs
          node --check scripts/verify-gaussian-video-playlist.mjs
          node --check scripts/verify-gaussian-artifact-resolver.mjs
          node --check scripts/verify-gaussian-current-contract.mjs
          node --check scripts/materialize-gaussian-renderer.mjs
          node --check scripts/materialize-gaussian-sources.mjs
          node --check scripts/compile-gaussian-producer-orientation.mjs
          node --check scripts/test-gaussian-producer-orientation.mjs
          node --check scripts/verify-gaussian-producer-orientation.mjs
          node --check scripts/verify-gaussian-physical-up-consumer.mjs
          node --check scripts/open-gaussian-project.mjs
          python -m py_compile scripts/gaussian_orientation.py scripts/test_gaussian_orientation.py
      - name: Validate 3DGS contracts
        run: |
          node scripts/verify-gaussian-fixtures.mjs
          node scripts/verify-gaussian-video-playlist.mjs
          node scripts/verify-gaussian-exhibition.mjs
          node scripts/verify-gaussian-presentation.mjs
          node scripts/verify-gaussian-artifact-resolver.mjs
          node scripts/verify-gaussian-current-contract.mjs
          node scripts/test-gaussian-producer-orientation.mjs
          node scripts/verify-gaussian-producer-orientation.mjs
          node scripts/verify-gaussian-physical-up-consumer.mjs
      - name: Verify diagnostic-only orientation reporting
        run: |
          python scripts/test_gaussian_orientation.py
          python scripts/gaussian_orientation.py \
            --allow-missing \
            --output Library/VRMine/gaussian-orientation-evidence.json
      - name: Materialize pinned Unity renderer at upstream-compatible path
        run: |
          node scripts/materialize-gaussian-renderer.mjs
          test -s Assets/VRChatGaussianSplatting/Scripts/GaussianSplatRenderer.cs
          test -s Assets/VRChatGaussianSplatting/Scripts/Importer/GaussianSplatImporter.cs
          test -d Assets/VRChatGaussianSplatting/Resources
          grep -F 'revision=f96c0117cba518ff84d059d36f16909b873e23aa' Assets/VRChatGaussianSplatting/VRMINE_UPSTREAM_REVISION.txt
      - name: Persist contract orientation decision matrix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 3dgs-orientation-contract-status
          path: Library/VRMine/gaussian-orientation-evidence.json
          if-no-files-found: error
          retention-days: 14

  artifact-verification:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Emit per-source status before private materialization
        run: |
          python scripts/gaussian_orientation.py \
            --allow-missing \
            --output Library/VRMine/gaussian-orientation-evidence.json
      - name: Resolve private artifact authentication
        id: access
        env:
          HF_OIDC_RESOURCE: buckets/k4fka/kafka-data-lake
        run: |
          mkdir -p Library/VRMine
          python -m pip install --quiet "huggingface_hub>=1.19,<2"

          set +e
          oidc_token="$(hf auth token 2>Library/VRMine/hf-oidc-error.txt)"
          oidc_status=$?
          set -e
          if [ "$oidc_status" -eq 0 ] && [ -n "$oidc_token" ]; then
            echo "::add-mask::$oidc_token"
            printf 'HF_TOKEN=%s\n' "$oidc_token" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "method=trusted_publisher_oidc" >> "$GITHUB_OUTPUT"
            python - <<'PY'
          import json
          from pathlib import Path
          status = {
              'schema_version': 3,
              'status': 'credential_available',
              'authentication_method': 'trusted_publisher_oidc',
              'oidc_resource': 'buckets/k4fka/kafka-data-lake',
              'reason': 'A short-lived bucket-scoped OIDC credential is available; exact artifact materialization will run',
          }
          Path('Library/VRMine/gaussian-artifact-verification-status.json').write_text(
              json.dumps(status, indent=2) + '\n', encoding='utf-8'
          )
          PY
            echo "Hugging Face artifact authentication method: trusted_publisher_oidc" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "method=none" >> "$GITHUB_OUTPUT"
            python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('config/gaussian-splats.json').read_text(encoding='utf-8'))
          status = {
              'schema_version': 3,
              'status': 'blocked',
              'reason': 'No matching Hugging Face Trusted Publisher OIDC credential',
              'registered_artifacts': len(registry['environments']),
              'authentication_attempts': ['trusted_publisher_oidc'],
              'oidc_resource': 'buckets/k4fka/kafka-data-lake',
              'next_action': 'configure the Hugging Face Trusted Publisher for KAFKA2306/vrmine + 3dgs-contracts.yml on the kafka-data-lake bucket',
          }
          Path('Library/VRMine/gaussian-artifact-verification-status.json').write_text(
              json.dumps(status, indent=2) + '\n', encoding='utf-8'
          )
          PY
            echo "::warning::Private Gaussian artifact verification is BLOCKED: no matching HF Trusted Publisher. Contract CI remains green; artifact bytes are not claimed verified."
            echo "### 3DGS private artifact verification" >> "$GITHUB_STEP_SUMMARY"
            echo "BLOCKED: configure Hugging Face Trusted Publisher for buckets/k4fka/kafka-data-lake. Registered orientation decisions remain explicit without pretending private bytes were read." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.access.outputs.available == 'true'
        with:
          node-version: 22
      - name: Check out pinned hf-cache-hub artifact resolver
        if: steps.access.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KAFKA2306/hf-cache-hub
          ref: b41ca5a6601a6ac7724cb09b3fe90554c7356d69
          path: .hf-cache-hub
      - name: Install artifact resolver dependencies
        if: steps.access.outputs.available == 'true'
        run: python -m pip install "PyYAML>=6.0,<7" "huggingface-hub>=1.19,<2" "filelock>=3.0"
      - name: Materialize and verify every registered PLY
        if: steps.access.outputs.available == 'true'
        env:
          HF_CACHE_HUB_ROOT: ${{ github.workspace }}/.hf-cache-hub
          HF_HOME: ${{ runner.temp }}/hf-cache
        run: |
          node scripts/materialize-gaussian-sources.mjs
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const registry = JSON.parse(fs.readFileSync('config/gaussian-splats.json', 'utf8'));
          for (const entry of registry.environments) {
            const file = path.join('Library/VRMine/GaussianSources', `${entry.id}.ply`);
            const stat = fs.statSync(file);
            if (stat.size !== entry.source.size_bytes) {
              throw new Error(`${entry.id}: expected ${entry.source.size_bytes} bytes, got ${stat.size}`);
            }
          }
          console.log(`Verified materialized registered PLY count=${registry.environments.length}`);
          NODE
      - name: Measure exact-hash geometry diagnostics for every PLY
        if: steps.access.outputs.available == 'true'
        run: |
          python scripts/gaussian_orientation.py \
            --output Library/VRMine/gaussian-orientation-evidence.json
          test -s Library/VRMine/gaussian-orientation-evidence.json
      - name: Mark private artifact verification complete
        if: steps.access.outputs.available == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('Library/VRMine/gaussian-orientation-evidence.json').read_text(encoding='utf-8'))
          status = {
              'schema_version': 3,
              'status': 'verified',
              'authentication_method': 'trusted_publisher_oidc',
              'registered_artifacts': evidence['summary']['registered'],
              'artifact_verification': evidence['summary']['artifact_verification'],
              'orientation_decisions': evidence['summary']['orientation_decisions'],
              'physical_up': evidence['summary']['physical_up'],
          }
          Path('Library/VRMine/gaussian-artifact-verification-status.json').write_text(
              json.dumps(status, indent=2) + '\n', encoding='utf-8'
          )
          PY
          echo "### 3DGS private artifact verification" >> "$GITHUB_STEP_SUMMARY"
          echo "VERIFIED: every registered PLY was materialized and exact-hash geometry diagnostics were persisted." >> "$GITHUB_STEP_SUMMARY"
      - name: Persist private artifact verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 3dgs-private-artifact-verification
          path: |
            Library/VRMine/gaussian-artifact-verification-status.json
            Library/VRMine/gaussian-orientation-evidence.json
            Library/VRMine/hf-oidc-error.txt
          if-no-files-found: error
          retention-days: 14

  unity-final-evidence:
    needs: contracts
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      UNITY_EXE: C:\Program Files\Unity\Hub\Editor\2022.3.22f1\Editor\Unity.exe
      HF_OIDC_RESOURCE: buckets/k4fka/kafka-data-lake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Require exact revision and Unity runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Checkout is not exact requested revision: expected $expected, got $actual" }
          if (!(Test-Path -LiteralPath $env:UNITY_EXE)) { throw "Unity editor not found: $env:UNITY_EXE" }
          & $env:UNITY_EXE -version -batchmode -quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve pinned VRChat packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/install-vrc-get.mjs
          & .tools\vrc-get.exe resolve
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize pinned Gaussian renderer
        shell: pwsh
        run: node scripts/materialize-gaussian-renderer.mjs

      - name: Verify canonical Unity scene and SDK validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/run-gaussian-unity.mjs registered
          node scripts/run-gaussian-unity.mjs sdk
          node scripts/run-gaussian-unity.mjs final

      - name: Resolve private Gaussian artifact authentication
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'Library\VRMine' | Out-Null
          python -m pip install --quiet "huggingface_hub>=1.19,<2" "PyYAML>=6.0,<7" "filelock>=3.0"
          $errorPath = 'Library\VRMine\hf-oidc-error.txt'
          $token = (& hf auth token 2>$errorPath | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($token)) {
            throw 'No matching Hugging Face Trusted Publisher credential. Configure KAFKA2306/vrmine + 3dgs-contracts.yml for buckets/k4fka/kafka-data-lake.'
          }
          Write-Output "::add-mask::$token"
          "HF_TOKEN=$token" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out pinned artifact resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KAFKA2306/hf-cache-hub
          ref: b41ca5a6601a6ac7724cb09b3fe90554c7356d69
          path: .hf-cache-hub

      - name: Materialize exact registered PLYs
        shell: pwsh
        env:
          HF_CACHE_HUB_ROOT: ${{ github.workspace }}\.hf-cache-hub
          HF_HOME: ${{ runner.temp }}\hf-cache
        run: node scripts/materialize-gaussian-sources.mjs

      - name: Measure exact registered PLYs in Unity
        shell: pwsh
        run: node scripts/run-gaussian-unity.mjs performance

      - name: Require measured registry-complete evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidencePath = 'Library\VRMine\gaussian-performance-evidence.json'
          if (!(Test-Path -LiteralPath $evidencePath)) { throw "Missing performance evidence: $evidencePath" }
          $evidence = Get-Content -Raw -LiteralPath $evidencePath | ConvertFrom-Json
          if ($evidence.status -ne 'MEASURED_REGISTRY_COMPLETE') { throw "Gaussian performance evidence is not registry-complete: $($evidence.status)" }
          if ([int]$evidence.registered -le 0 -or [int]$evidence.sourcePlyFiles -ne [int]$evidence.registered) {
            throw "Gaussian source measurement mismatch: registered=$($evidence.registered), sourcePlyFiles=$($evidence.sourcePlyFiles)"
          }

      - name: Persist exact-revision Unity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 3dgs-unity-final-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            Library/VRMine/unity-*.log
            Library/VRMine/gaussian-u2-evidence.json
            Library/VRMine/gaussian-build-evidence.json
            Library/VRMine/gaussian-performance-evidence.json
            Library/VRMine/hf-oidc-error.txt
          if-no-files-found: warn
          retention-days: 14

name: Audit live VRMine Pages

on:
  pull_request:
    paths:
      - ".github/workflows/live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live pages
        run: |
          set -euo pipefail
          base="https://kafka2306.github.io/vrmine"
          tmp="$(mktemp -d)"
          status="$(curl --silent --show-error --location -o "$tmp/index.html" -w '%{http_code}' "$base/?audit=${GITHUB_SHA}")"
          echo "ROOT_HTTP_STATUS=${status}"
          test "$status" = "200"
          grep -F 'vrmine-game-hub-2026-07-26-1' "$tmp/index.html"
          curl --fail --silent --show-error --location "$base/games/answer-impostor/?audit=${GITHUB_SHA}" -o "$tmp/answer.html"
          curl --fail --silent --show-error --location "$base/games/abyss-invasion/?audit=${GITHUB_SHA}" -o "$tmp/abyss.html"
          curl --fail --silent --show-error --location "$base/games/stich-meister/?audit=${GITHUB_SHA}" -o "$tmp/stich.html"
          curl --fail --silent --show-error --location "$base/games/answer-impostor/engine.mjs?audit=${GITHUB_SHA}" -o "$tmp/engine.mjs"
          grep -F 'Answer Impostor' "$tmp/answer.html"
          grep -F '深淵侵蝕' "$tmp/abyss.html"
          grep -F 'Stich-Meister' "$tmp/stich.html"
          grep -F 'scoreRound' "$tmp/engine.mjs"
          echo "LIVE_AUDIT_OK $base/"
